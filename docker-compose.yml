services:
  db:
    image: postgres:15-alpine
    container_name: chronos_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronos_password}
      POSTGRES_DB: ${POSTGRES_DB:-chronos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema initialization (runs on FIRST init of the volume)
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/fix_indexes.sql:/docker-entrypoint-initdb.d/02-fix_indexes.sql
      - ./backend/db/add_snapshot_optimization.sql:/docker-entrypoint-initdb.d/03-snapshot-schema.sql
      - ./backend/db/auto_snapshot_trigger.sql:/docker-entrypoint-initdb.d/04-snapshot-trigger.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronos_user} -d ${POSTGRES_DB:-chronos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  chronos-redis:
    image: redis:7-alpine
    container_name: chronos_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chronos_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PUBLIC_DEMO_MODE: "false"
      DATABASE_URL: postgresql://chronos_user:chronos_password@db:5432/chronos
      REDIS_URL: redis://chronos-redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHRONOS_API_KEYS: ${CHRONOS_API_KEYS}
      CHRONOS_CORS_ORIGINS: ${CHRONOS_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CHRONOS_ADMIN_PASSWORD: ${CHRONOS_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      chronos-redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
